<text x="360.9" y="412.0" font-size="12" fill="#1d3040" text-anchor="start" font-weight="700">5 条（4.5%）</text>
<text x="248.0" y="479.0" font-size="12" fill="#425466" text-anchor="end" font-weight="normal">时间冲突</text>
