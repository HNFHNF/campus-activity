<text x="48.0" y="575.0" font-size="11" fill="#7b8794" text-anchor="start" font-weight="normal">编码规则：按关键词命中，一条反馈可同时命中多个主题；完整关键词见 tools/analyze.py。</text>
<text x="48.0" y="598.0" font-size="11" fill="#7b8794" text-anchor="start" font-weight="normal">说明：反馈只能说明“反馈样本中有人提到”，不能等同于 29.5% 的学生都遇到该问题。</text>
</g></svg>